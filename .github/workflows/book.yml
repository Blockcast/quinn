name: Build book

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    timeout-minutes: 15
    runs-on:
      group: default-tools
      labels: arc-light
    steps:
      - uses: actions/checkout@v7
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'
      - run: mdbook build ./docs/book
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book/book
